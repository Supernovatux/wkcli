[package]
name = "wkcli"
version = "0.1.0"
edition = "2024"
description = "Unofficial terminal client for doing WaniKani reviews"
license = "MIT"
repository = "https://github.com/Supernovatux/wkcli"
readme = "readme.md"
keywords = ["wanikani", "japanese", "kanji", "srs", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.10.3"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
resvg = { version = "0.49.0", default-features = false, features = ["system-fonts", "text"] }
rodio = { version = "0.23.0", default-features = false, features = ["mp3", "playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = { version = "3.5.1", features = ["json"] }
